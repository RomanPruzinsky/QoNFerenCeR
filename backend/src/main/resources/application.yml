spring:
   application:
      name: backend

   data:
      web:
         pageable:
            max-page-size: 100

   datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}

   jpa:
      hibernate:
         ddl-auto: validate
      open-in-view: false
      properties:
         hibernate:
            jdbc:
               time_zone: UTC

   flyway:
      enabled: true
      locations: classpath:db/migration

server:
   port: 8080

management:
   endpoints:
      web:
         exposure:
            include: health, info, metrics
   endpoint:
      health:
         probes:
            enabled: true

qonferencer:
   keycloak:
      issuer: ${KC_ISSUER}
      jwk-set-uri: ${KC_JWK_SET_URI}
      admin:
         server-url: ${KC_ADMIN_URL}
         client-id: qonferencer-backend-admin # must match "clientId" of service-account client in `realm-export`
         client-secret: ${KC_BEADMIN_CLIENT_SECRET}
         realm: qonferencer # must match "realm" in `realm-export`
         bootstrap-username: First Admin # must match "username" of the admin user in `realm-export`
   n8n:
      enabled: ${N8N_ENABLED}
      base-url: ${N8N_BASE_URL}
      path-prefix: ${N8N_PATH_PREFIX}
      event-id: ${EVENT_ID}
      auth-token: ${BE_N8N_COMMS__AUTH_TOKEN}
      timeout-ms: ${N8N_TIMEOUT_MS}

logging:
   level:
      tr.qonferencer: DEBUG # TODO: INFO prod — DEBUG may echo entity fields incl. names
      org.springframework.security: INFO
