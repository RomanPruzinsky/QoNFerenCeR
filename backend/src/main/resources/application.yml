spring:
   application:
      name: backend

   data:
      web:
         pageable:
            max-page-size: 100

   datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}

   jpa:
      hibernate:
         ddl-auto: validate
      open-in-view: false
      properties:
         hibernate:
            jdbc:
               time_zone: UTC

   flyway:
      enabled: true
      locations: classpath:db/migration

server:
   port: 8080

management:
   endpoints:
      web:
         exposure:
            include: health, info, metrics
   endpoint:
      health:
         probes:
            enabled: true

qonferencer:
   keycloak:
      issuer: ${KC_ISSUER}
      jwk-set-uri: ${KC_JWK_SET_URI}
      admin:
         server-url: ${KC_ADMIN_URL}
         realm: ${KC_REALM}
         client-id: ${KC_ADMIN_CLIENT_ID}
         client-secret: ${KC_ADMIN_CLIENT_SECRET}
   n8n:
      enabled: ${N8N_ENABLED}
      base-url: ${N8N_BASE_URL}
      path-prefix: ${N8N_PATH_PREFIX}
      event-id: ${EVENT_ID}
      auth-token: ${N8N_AUTH_TOKEN}
      timeout-ms: ${N8N_TIMEOUT_MS:3000}

logging:
   level:
      tr.qonferencer: DEBUG # TODO: INFO prod — DEBUG may echo entity fields incl. names
      org.springframework.security: INFO
