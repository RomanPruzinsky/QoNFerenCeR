spring:
   application:
      name: backend

   datasource:
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qonferencer}
      username: ${SPRING_DATASOURCE_USERNAME:app}
      password: ${SPRING_DATASOURCE_PASSWORD:secret}

   jpa:
      hibernate:
         ddl-auto: validate
      open-in-view: false
      properties:
         hibernate:
            jdbc:
               time_zone: UTC

   flyway:
      enabled: true
      locations: classpath:db/migration

server:
   port: 8080

management:
   endpoints:
      web:
         exposure:
            include: health, info, metrics
   endpoint:
      health:
         probes:
            enabled: true

qonferencer:
   keycloak:
      issuer: ${KC_ISSUER:http://localhost:8080/realms/qonferencer}
      jwk-set-uri: ${KC_JWK_SET_URI:http://localhost:8080/realms/qonferencer/protocol/openid-connect/certs}
      admin:
         server-url: ${KC_ADMIN_URL:http://localhost:8080}
         realm: ${KC_REALM:qonferencer}
         client-id: ${KC_ADMIN_CLIENT_ID:qonferencer-backend-admin}
         client-secret: ${KC_ADMIN_CLIENT_SECRET:backend-admin-secret} # TODO: real secret prod
   n8n:
      enabled: ${N8N_ENABLED:false} # TODO: true prod
      base-url: ${N8N_BASE_URL:http://localhost:5678/webhook}
      path-prefix: ${N8N_PATH_PREFIX:qonferencer_base}
      event-name: ${QONFERENCER_EVENT:local-dev} # TODO: real conference id prod
      path-token: ${N8N_PATH_TOKEN:} # TODO: generated per install
      timeout-ms: ${N8N_TIMEOUT_MS:3000}

logging:
   level:
      tr.qonferencer: DEBUG # TODO: INFO prod — DEBUG may echo entity fields incl. names
      org.springframework.security: INFO
