services:

   postgres:
      image: postgres:16
      environment:
         POSTGRES_DB: qonferencer
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
         - "5432:5432"
      volumes:
         - postgres_data:/var/lib/postgresql/data
         - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      healthcheck:
         test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d qonferencer" ]
         interval: 5s
         retries: 5

   keycloak:
      # sslRequired="external"  # TODO_CHANGEME: "none" for localhost only; switch for prod, also in QoNFerenCeR-realm (~line 4)
      # not "all" (breaks internal backend -> keycloak hop); behind TLS-terminating proxy also set KC_PROXY_HEADERS=xforwarded + real KC_HOSTNAME
      image: quay.io/keycloak/keycloak:26.0
      environment:
         KC_DB: postgres
         KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
         KC_DB_USERNAME: ${POSTGRES_USER}
         KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
         KEYCLOAK_ADMIN: ${KC_CONSOLEADMIN_USERNAME}
         KEYCLOAK_ADMIN_PASSWORD: ${KC_CONSOLEADMIN_PASSWORD}
         KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
         KC_HEALTH_ENABLED: "true"
      command: start-dev --import-realm
      volumes:
         - ./keycloak/QoNFerenCeR-realm.json:/opt/keycloak/data/import/QoNFerenCeR-realm.json:ro
      ports:
         - "8080:8080"
      depends_on:
         postgres:
            condition: service_healthy
      healthcheck:
         test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000" ]
         interval: 5s
         timeout: 5s
         retries: 5
         start_period: 10s

   backend:
      build:
         context: ..
         dockerfile: deploy/Dockerfile
      ports:
         - "8081:8080"
      environment:
         SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qonferencer
         SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
         SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
         KC_ISSUER: ${KEYCLOAK_HOSTNAME}/realms/QoNFerenCeR
         KC_JWK_SET_URI: http://keycloak:8080/realms/QoNFerenCeR/protocol/openid-connect/certs
         KC_ADMIN_URL: http://keycloak:8080
         KC_BEADMIN_CLIENT_SECRET: ${KC_BEADMIN_CLIENT_SECRET}
         N8N_ENABLED: ${N8N_ENABLED}
         N8N_BASE_URL: http://n8n:5678/webhook
         N8N_PATH_PREFIX: ${N8N_PATH_PREFIX}
         N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS}
         BE_N8N_COMMS__AUTH_TOKEN: ${BE_N8N_COMMS__AUTH_TOKEN}
         EVENT_ID: ${EVENT_ID}
      depends_on:
         postgres:
            condition: service_healthy
         keycloak:
            condition: service_healthy

   n8n:
      image: n8nio/n8n:1.70.4
      ports:
         - "5678:5678"
      environment:
         N8N_HOST: localhost
         N8N_PORT: "5678"
         N8N_PROTOCOL: http
         N8N_SECURE_COOKIE: "false"
         NODE_ENV: production
         WEBHOOK_URL: http://localhost:5678/
         GENERIC_TIMEZONE: Europe/Bratislava
         DB_TYPE: postgresdb
         DB_POSTGRESDB_HOST: postgres
         DB_POSTGRESDB_PORT: "5432"
         DB_POSTGRESDB_DATABASE: n8n
         DB_POSTGRESDB_USER: ${POSTGRES_USER}
         DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
         N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
         N8N_DIAGNOSTICS_ENABLED: "false"
         N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      depends_on:
         postgres:
            condition: service_healthy
      volumes:
         - n8n_data:/home/node/.n8n

volumes:
   postgres_data:
   n8n_data:
